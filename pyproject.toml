[project]
name = "coffee-beans"
version = "0.1.0"
dependencies = [
    "Flask==3.0.3",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Migrate==4.0.7",
    "Flask-JWT-Extended==4.6.0",
    "Flask-Cors==4.0.1",
    "python-dotenv==1.0.1",
    "Werkzeug==3.0.3",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "gunicorn>=21.2.0",
    "pytz>=2024.1"
]
requires-python = ">=3.10"

[tool.vercel]
entrypoint = "api.index:app"

[tool.pyright]
extraPaths = ["backend"]
include = ["backend", "api"]
exclude = ["node_modules", "dist", "src"]
